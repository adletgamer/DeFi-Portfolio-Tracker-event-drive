# ElasticMQ configuration for local development.
# Binds the SQS-compatible REST interface to 127.0.0.1:9324.
include classpath("application.conf")

node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "defi-events" {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
}
